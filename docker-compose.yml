version: '3.8'

services:
  capability_registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capability_registry_service
    ports:
      - "8083:8083"
    environment:
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./keys:/app/keys:ro
      - ./logs:/app/logs
    depends_on:
      - mongo
    networks:
      - underleaf_network
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: capability_registry_mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secure-password
      - MONGO_INITDB_DATABASE=capability_registry
    volumes:
      - mongo_data:/data/db
    networks:
      - underleaf_network
    restart: unless-stopped

networks:
  underleaf_network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
